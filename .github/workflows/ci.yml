name: CI

# `scripts/verify.mjs` and the unit tests are the project's only automated
# gate. Running them on every push is what makes that gate meaningful: without
# CI a broken hook file could land and nobody would notice until the extension
# failed to load.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 18 reached end of life in April 2025. The gate uses
        # `readdirSync`/`structuredClone`-era APIs and the `--check` flag, all
        # of which are stable on 20 and 22; testing the LTS pair keeps the
        # matrix meaningful without certuring an unsupported runtime.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package-manager-version: '10'

      # P1: install dev dependencies (eslint, prettier) alongside the
      # dependency-free runtime scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--lint` runs every structural check and then adds the lint rules,
      # so a second plain run only duplicated the whole gate's output.
      - name: Structural verification + lint rules
        run: node scripts/verify.mjs --lint

      - name: Unit tests
        run: node scripts/test.mjs

      # P1: ESLint + Prettier as separate steps so failures are clearly
      # attributed to formatting/style vs. structural issues.
      - name: ESLint
        run: pnpm run lint:eslint

      - name: Prettier check
        run: pnpm run lint:prettier

      # P10: type-check the core engine with JSDoc + tsc --noEmit.
      - name: Type-check core
        run: pnpm run typecheck

      # The canvas/audio hot path is the only place where a correct but slow
      # rewrite would still pass every other check. Run the benchmark so a
      # regression to per-sample string building fails the build.
      - name: Hot-path benchmark
        run: node scripts/bench.mjs

      - name: Build package
        run: node scripts/build.mjs

      # The icons are generated from scripts/brand-spec.mjs. Nothing compared
      # the committed PNGs against that spec, so a brand change could land with
      # stale icons and every other check would still pass. Regenerate, then
      # fail if the tree changed.
      - name: Icons match the brand spec
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: |
          node scripts/generate-icons.mjs
          git diff --exit-code -- images

      - name: Upload dist
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: shapeshift-dist
          # `dist` uploads the directory itself so the artifact arrives as a
          # complete unpacked extension tree.
          path: dist
          if-no-files-found: error

  # P5 + P14: browser-level integration tests run as a separate job so they
  # need Chromium + the browser binaries. They only run on one OS/Node combo
  # to avoid duplicating the ~30 s browser install across the matrix.
  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package-manager-version: '10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build extension
        run: node scripts/build.mjs

      - name: Run e2e extension tests
        run: pnpm run test:e2e

      - name: Run accessibility audit
        run: pnpm run test:a11y
